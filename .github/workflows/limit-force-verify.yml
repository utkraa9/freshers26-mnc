name: Restrict force verification to main admin

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/limit-force-verify.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch organizer verification permissions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('admin.html')
          s = p.read_text(encoding='utf-8')

          old = "body.innerHTML=data.map(r=>`<tr><td>${esc(r.name)}</td><td>${esc(r.roll_number)}</td><td>${esc(r.category)}</td><td>₹${Number(r.amount||0).toLocaleString('en-IN')}</td><td>${esc(r.payment_status||'pending')}</td><td>${r.payment_status==='verified'?'<span class=\"badge\">Verified</span>':`<button class=\"btn\" onclick=\"verifyPayment('${r.id}')\">Force verify</button>`}</td></tr>`).join('');updateOverview(data)}"
          new = "body.innerHTML=data.map(r=>`<tr><td>${esc(r.name)}</td><td>${esc(r.roll_number)}</td><td>${esc(r.category)}</td><td>₹${Number(r.amount||0).toLocaleString('en-IN')}</td><td>${esc(r.payment_status||'pending')}</td><td>${r.payment_status==='verified'?'<span class=\"badge\">Verified</span>':isMainAuthority?`<button class=\"btn\" onclick=\"verifyPayment('${r.id}')\">Force verify</button>`:'<span class=\"muted small\">Awaiting automatic verification</span>'}</td></tr>`).join('');updateOverview(data)}"
          if old not in s:
              raise SystemExit('Expected registration action markup not found')
          s = s.replace(old, new, 1)

          old2 = "async function verifyPayment(id){if(!confirm('Only use this after confirming the payment succeeded in Razorpay. Continue?'))return;"
          new2 = "async function verifyPayment(id){if(!isMainAuthority){alert('Only the main admin can force verify payments.');return}if(!confirm('Only use this after confirming the payment succeeded in Razorpay. Continue?'))return;"
          if old2 not in s:
              raise SystemExit('Expected verifyPayment guard not found')
          s = s.replace(old2, new2, 1)

          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit and remove patch workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add admin.html .github/workflows/limit-force-verify.yml
          git commit -m "security: restrict force verification to main admin" || exit 0
          git rm .github/workflows/limit-force-verify.yml
          git commit -m "chore: remove temporary verification patch workflow"
          git push
