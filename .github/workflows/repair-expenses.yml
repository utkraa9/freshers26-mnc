name: Apply expenses fallback
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch admin expenses flow
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('admin.html')
          s=p.read_text(encoding='utf-8')
          patch=Path('expenses_patch.txt').read_text(encoding='utf-8').strip()
          start=s.find('async function addExpense(){')
          end=s.find('async function loadOrganizerRequests(){', start)
          if start<0 or end<0:
              raise SystemExit('expense function block not found')
          s=s[:start]+patch+'\n'+s[end:]
          p.write_text(s,encoding='utf-8')
          PY
      - name: Validate
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('admin.html').read_text(encoding='utf-8')
          assert 'authenticated Supabase insert' in s
          assert 'async function loadExpenses()' in s
          PY
      - name: Commit and remove temporary files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f expenses_patch.txt .github/workflows/repair-expenses.yml
          git add admin.html expenses_patch.txt .github/workflows/repair-expenses.yml
          git commit -m 'fix: make organizer expenses save robustly'
          git push
