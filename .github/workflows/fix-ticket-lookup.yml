name: Fix public ticket lookup
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
      - name: Patch public lookup
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, base64
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          new = base64.b64decode('').decode()
          pattern = re.compile(r'async function lookupTicket\(\)\{.*?(?=const renderer=)', re.S)
          if not pattern.search(s):
              raise SystemExit('lookupTicket function not found')
          s2 = pattern.sub(new + '\n', s, count=1)
          s2 = s2.replace('Query registration by Roll Number or Reference ID.', 'Query registration by Roll Number, Reference ID, or Name.')
          p.write_text(s2, encoding='utf-8')
          PY
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'fix: make public ticket lookup robust'
          git push