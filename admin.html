<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Freshers'26 Admin</title><style>body{font-family:system-ui;margin:0;background:#f7f8fc;color:#111827}.wrap{max-width:1000px;margin:auto;padding:30px 18px}.card{background:#fff;border:1px solid #e5e7eb;border-radius:16px;padding:18px;margin:12px 0}.row{display:flex;gap:8px;flex-wrap:wrap}button{padding:9px 12px;border:0;border-radius:9px;background:#111827;color:white;cursor:pointer}table{width:100%;border-collapse:collapse}th,td{padding:10px;border-bottom:1px solid #eee;text-align:left;font-size:14px}.pill{padding:4px 8px;border-radius:99px;background:#fef3c7}.ok{background:#dcfce7}.danger{background:#fee2e2}</style></head><body><div class="wrap"><h1>Freshers'26 Admin</h1><p>Local demo admin panel. In production, connect this to a shared Google Sheet/Apps Script backend before deployment.</p><div class="card"><b>Admin actions</b><div class="row" style="margin-top:10px"><button onclick="exportCSV()">Export CSV</button><button onclick="clearAll()">Clear local data</button></div></div><div class="card"><table><thead><tr><th>Submission</th><th>Name</th><th>Roll</th><th>Type</th><th>Amount</th><th>UTR</th><th>Status</th><th>Action</th></tr></thead><tbody id="rows"></tbody></table></div></div><script>const key='freshers26_submissions',ticketKey='freshers26_ticket';function esc(x){return String(x||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]);}function load(){const a=JSON.parse(localStorage.getItem(key)||'[]');rows.innerHTML=a.map((s,i)=>`<tr><td>${esc(s.id)}</td><td>${esc(s.name)}</td><td>${esc(s.roll)}</td><td>${esc(s.category)}</td><td>${esc(s.amount)}</td><td>${esc(s.utr)}</td><td><span class="pill ${s.status==='VERIFIED'?'ok':''}">${s.status}</span></td><td>${s.status==='PENDING'?`<button onclick="verify(${i})">Verify & Issue Ticket</button>`:'—'}</td></tr>`).join('')||'<tr><td colspan="8">No submissions yet.</td></tr>'}function verify(i){const a=JSON.parse(localStorage.getItem(key)||'[]');a[i].status='VERIFIED';const ticket={ticketId:'FM26-'+Date.now().toString(36).toUpperCase(),name:a[i].name,roll:a[i].roll,category:a[i].category,submissionId:a[i].id};localStorage.setItem(key,JSON.stringify(a));localStorage.setItem(ticketKey,JSON.stringify(ticket));alert('Verified and ticket issued on this browser/device.');load()}function exportCSV(){const a=JSON.parse(localStorage.getItem(key)||'[]');const h=['Submission ID','Name','Roll','Category','Amount','UTR','Phone','Status','Created'];const rows=a.map(s=>[s.id,s.name,s.roll,s.category,s.amount,s.utr,s.phone,s.status,s.created]);const csv=[h,...rows].map(r=>r.map(x=>'"'+String(x??'').replaceAll('"','""')+'"').join(',')).join('\n');const b=new Blob([csv],{type:'text/csv'}),u=URL.createObjectURL(b),x=document.createElement('a');x.href=u;x.download='freshers26_submissions.csv';x.click();URL.revokeObjectURL(u)}function clearAll(){if(confirm('Clear all local submissions and ticket?')){localStorage.removeItem(key);localStorage.removeItem(ticketKey);load()}}load();</script></body></html>
